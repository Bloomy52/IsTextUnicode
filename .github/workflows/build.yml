name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release
        run: >
          msbuild IsUnicodeText/IsUnicodeText.vbproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=AnyCPU

      - name: Compile C demonstration
        shell: pwsh
        run: |
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products '*' `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath

            if (!$vsPath) {
              throw "MSVC build tools were not found."
            }

            $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"

            cmd.exe /c "`"$devCmd`" -arch=x64 -host_arch=x64 && cl.exe /nologo /W4 /O2 /MT test_unicode.c /Fe:test_unicode.exe /link Advapi32.lib"

            if ($LASTEXITCODE -ne 0) {
              throw "The C demonstration failed to compile."
            }

      - name: Verify executable exists
        run: |
          if (!(Test-Path "IsUnicodeText/bin/Release/IsUnicodeText.exe")) {
            throw "The build did not produce IsUnicodeText.exe."
          }

      - name: Attest executables
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/IsUnicodeText/bin/Release/IsUnicodeText.exe
            ${{ github.workspace }}/test_unicode.exe

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "IsUnicodeText/bin/Release/IsUnicodeText.exe" `
            "test_unicode.exe" `
            --verify-tag `
            --title "IsUnicodeText $env:RELEASE_TAG" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
            throw "Release publication failed."
          }
